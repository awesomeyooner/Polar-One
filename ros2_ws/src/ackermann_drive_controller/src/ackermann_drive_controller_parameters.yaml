ackermann_drive_controller:
  command_topic: {
    type: string,
    default_value: "~/cmd_vel",
    description: "Which topic to subscribe to for the twist message"
  }
  steer_joint_names: {
    type: string_array,
    default_value: [],
    description: "Names of the steering joints (revolute)",
    validation: {
      not_empty<>: []
    }
  }
  drive_joint_names: {
    type: string_array,
    default_value: [],
    description: "Names of the drive joints (continous)",
    validation: {
      not_empty<>: []
    }
  }
  command_timeout: {
    type: double,
    default_value: 1.0,
    description: "How old a command can be until the controller halts the drivetrain",
  }